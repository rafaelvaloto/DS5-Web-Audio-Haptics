<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS5 Web Audio Haptics</title>
    <style>
      :root {
        --bg-body: #0f1115;
        --bg-card: #1c2028;
        --border: #2d3340;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --danger: #dc2626;
        --success: #16a34a;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 0; /* Removido padding para o topo colar na tela se necessário, ou mantido no container */
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }

      /* Header do Projeto */
      .app-header {
        font-size: 1.2rem;
        font-weight: 600;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 4px;
      }

      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }

      /* Status Bar Simplificada */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        padding: 12px 16px;
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot.gray {
        background-color: var(--text-muted);
      }

      /* Buttons */
      .btn {
        padding: 10px 14px;
        border: none;
        border-radius: var(--radius);
        font-weight: 500;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.2s;
        text-align: center;
      }
      .btn-primary {
        background-color: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
      }
      .btn-outline {
        background-color: transparent;
        border: 1px solid var(--border);
        color: var(--text-main);
      }
      .btn-outline:hover {
        background-color: var(--border);
      }
      .btn-disabled {
        background-color: var(--border);
        color: var(--text-muted);
        cursor: not-allowed;
      }

      /* Forms & Inputs */
      .flow-control {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }

      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        background-color: var(--bg-body);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 8px;
        border-radius: var(--radius);
        outline: none;
      }

      /* Audio Grid */
      .audio-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: center;
        font-size: 0.9rem;
      }
      .audio-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .audio-control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      input[type="range"] {
        width: 100%;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      /* Lightbar */
      .color-picker {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .color-circle {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .color-circle.active {
        border-color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Status Simplificado -->
      <div class="card status-bar">
        <div class="status-item">
          <div class="dot gray"></div>
          Audio:
        </div>
        <div class="status-item">🔋 Battery:</div>
        <div class="status-item">⏱️ Rate: 100 Hz</div>
      </div>

      <!-- Fluxo Principal -->
      <div class="card flow-control">
        <h2>🔌 Connection Flow</h2>
        <button class="btn btn-primary">1) Load WASM</button>
        <button class="btn btn-disabled">2) Connect DualSense (WebHID)</button>
        <div class="row">
          <button class="btn btn-disabled">3) Play</button>
          <button class="btn btn-disabled">4) Stop</button>
        </div>
        <button class="btn btn-outline" style="margin-top: 4px">
          📄 Show Logs
        </button>
      </div>

      <!-- Triggers -->
      <div class="card">
        <h2>🔫 Triggers</h2>
        <div class="row" style="margin-bottom: 12px">
          <select>
            <option>None / Off</option>
          </select>
          <select>
            <option>Right (R2)</option>
          </select>
        </div>
        <div class="row">
          <button class="btn btn-primary">Apply Effect</button>
          <button class="btn btn-outline">Reset</button>
        </div>
      </div>

      <!-- Lightbar -->
      <div class="card">
        <h2>💡 Lightbar</h2>
        <div class="color-picker">
          <div class="color-circle active" style="background: #38bdf8"></div>
          <div class="color-circle" style="background: #ef4444"></div>
          <div class="color-circle" style="background: #eab308"></div>
          <div class="color-circle" style="background: #22c55e"></div>
          <div class="color-circle" style="background: #3b82f6"></div>
          <div class="color-circle" style="background: #a855f7"></div>
          <div class="color-circle" style="background: #ffffff"></div>
          <div
            class="color-circle"
            style="background: #000000; border: 1px solid #333"
          ></div>
        </div>
      </div>

      <!-- Audio & Haptics -->
      <div class="card">
        <h2>🔊 Audio & Haptics</h2>
        <button
          class="btn btn-primary"
          style="width: 100%; margin-bottom: 16px"
        >
          Toggle Audio Haptics (Off)
        </button>

        <div class="audio-grid">
          <div class="audio-control">
            <label>Volume</label>
            <input type="range" value="100" />
          </div>
          <div class="audio-control">
            <label>Gain (1.0)</label>
            <input type="range" value="50" />
          </div>

          <label class="checkbox-group">
            <input type="checkbox" /> Headset only
          </label>
          <label class="checkbox-group">
            <input type="checkbox" /> Audio only
          </label>

          <div class="audio-control-row" style="grid-column: span 2">
            <label>Reduce Vibration</label>
            <input type="number" value="0" style="width: 80px" />
          </div>
        </div>
      </div>

      <!-- Input Server -->
      <div class="card">
        <h2>🎮 Input Server</h2>
        <div class="flow-control">
          <div class="audio-control">
            <label style="font-size: 0.9rem; color: var(--text-muted)"
              >Server URL</label
            >
            <input type="text" value="ws://localhost:26760" />
          </div>
          <div class="row" style="align-items: center">
            <button class="btn btn-primary">Connect</button>
            <span
              style="
                font-size: 0.85rem;
                font-weight: bold;
                color: var(--text-muted);
                text-align: right;
                flex: 1;
              "
              >Disconnected</span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
