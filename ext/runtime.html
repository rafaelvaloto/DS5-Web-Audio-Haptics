<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DualSense Runtime</title>
    <style>
        :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090d16; color: #f1f5f9; }
        .notice { width: 100%; box-sizing: border-box; padding: 22px; text-align: center; }
        h2 { margin: 0 0 10px; color: #38bdf8; font-size: 18px; }
        p { margin: 6px 0; color: #94a3b8; line-height: 1.45; }
        .keep-open { color: #10b981; font-weight: 600; }
        iframe { position: fixed; left: 0; top: 0; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
<div class="notice">
    <h2>🎮 <span data-i18n="runtime.title">DualSense active</span></h2>
    <p class="keep-open" data-i18n="runtime.keepOpen">Keep this window open or minimized.</p>
    <p data-i18n="runtime.description">It keeps WASM, the controller and audio running when the side panel is closed.</p>
</div>
<iframe src="index.html?runtime=1" title="DualSense runtime"></iframe>
<script type="module" src="runtime.js"></script>
</body>
</html>
