<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS5 Web Audio Haptics</title>
    <style>
      :root {
        --bg-body: #0f1115;
        --bg-card: #1c2028;
        --border: #2d3340;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --danger: #dc2626;
        --success: #16a34a;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-width: 0;
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        background: var(--bg-body);
        color: var(--text-main);
        font:
          14px system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        color: var(--text-muted);
        padding: 12px 16px;
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .status-item strong {
        color: var(--text-main);
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      .dot.active {
        background: var(--success);
      }
      .flow-control {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
        min-width: 0;
      }
      .btn {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-weight: 500;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.2s;
        text-align: center;
        background: transparent;
        color: var(--text-main);
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-outline:hover {
        background: var(--border);
      }
      .btn-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        background: var(--bg-body);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 8px;
        border-radius: var(--radius);
        outline: none;
      }
      .control-inputs {
        display: flex;
        gap: 10px;
      }
      .control-inputs > * {
        flex: 1;
        min-width: 0;
      }
      .audio-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: center;
        font-size: 0.9rem;
      }
      .audio-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .audio-control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .audio-control input[type="range"],
      input[type="range"] {
        width: 100%;
        accent-color: #93c5fd;
      }
      .audio-control output {
        color: var(--text-muted);
        font-size: 0.8rem;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .checkbox-group input {
        accent-color: var(--primary);
      }
      .color-picker {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .color-circle,
      .color-preset-btn,
      #picker-led-color {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        padding: 0;
      }
      .color-circle.active,
      .color-preset-btn.active {
        border-color: #fff;
      }
      #picker-led-color {
        appearance: none;
        overflow: hidden;
        background: transparent;
      }
      #picker-led-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      #picker-led-color::-webkit-color-swatch {
        border: 0;
        border-radius: 50%;
      }
      .input-server-help {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.4;
      }
      .log-modal {
        width: min(94vw, 760px);
        max-height: 82vh;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-card);
        color: var(--text-main);
      }
      .log-modal::backdrop {
        background: #000b;
      }
      .log-modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .log-modal-body {
        padding: 10px;
      }
      .log-container {
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #090d16;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font: 12px monospace;
        line-height: 1.45;
      }
      .technical {
        display: none !important;
      }
      @media (max-width: 380px) {
        .container {
          padding: 12px;
          gap: 12px;
        }
        .card {
          padding: 12px;
        }
        .status-bar {
          font-size: 0.78rem;
          gap: 6px;
          padding: 10px;
        }
        .audio-grid {
          grid-template-columns: 1fr;
        }
        .audio-control-row {
          grid-column: span 1 !important;
        }
        .control-inputs {
          flex-direction: column;
        }
      }
      /* Mantém o valor disponível para o app, sem criar uma linha extra no layout. */
      #input-audio-volume-value {
        display: none;
      }
      #input-audio-gain-value {
        display: inline;
        color: var(--text-main);
        font-size: inherit;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card status-bar">
        <div class="status-item">🔋 <strong id="lbl-battery">--%</strong></div>
        <div class="status-item">
          <span id="dot-audio-haptics" class="dot"></span
          ><span data-i18n="status.audioHaptics">Audio</span>
        </div>
        <div class="status-item">
          ⏱️ <span data-i18n="status.rate">Rate</span>: 100 Hz
        </div>
        <span id="dot-wasm" class="technical"></span
        ><strong id="lbl-wasm" class="technical"></strong>
        <span id="dot-hid" class="technical"></span
        ><strong id="lbl-device" class="technical"></strong>
        <span id="dot-touch" class="technical"></span
        ><strong id="lbl-touch" class="technical"></strong>
        <strong id="lbl-audio-haptics" class="technical"></strong
        ><strong id="lbl-fps" class="technical"></strong>
      </div>
      <section class="card flow-control">
        <h2>
          🔌 <span data-i18n="controls.connectionFlow">Connection Flow</span>
        </h2>
        <button
          id="btn-load"
          class="btn btn-primary"
          data-i18n="header.btnLoadWasm"
        >
          1) Load WASM</button
        ><button
          id="btn-request"
          class="btn btn-primary"
          data-i18n="header.btnConnectHid"
        >
          2) Connect DualSense (WebHID)
        </button>
        <div class="row">
          <button
            id="btn-start"
            class="btn btn-primary"
            disabled
            data-i18n="header.btnStartLoop"
          >
            3) Play</button
          ><button
            id="btn-stop"
            class="btn btn-danger"
            disabled
            data-i18n="header.btnStopLoop"
          >
            4) Stop
          </button>
        </div>
        <button id="btn-show-logs" class="btn" data-i18n="controls.showLogs">
          📄 Show Logs
        </button>
      </section>
      <section class="card">
        <h2>
          🔫 <span data-i18n="controls.triggerEffectsTitle">Triggers</span>
        </h2>
        <div class="row" style="margin-bottom: 12px">
          <select id="sel-trigger-effect" class="control-select">
            <option value="none" data-i18n="controls.effectNone">
              None / Off
            </option>
            <option value="feedback" data-i18n="controls.effectFeedback">
              Rigid Feedback (R2)
            </option>
            <option value="bow" data-i18n="controls.effectBow">
              Bow Tension (R2)
            </option>
            <option value="weapon" data-i18n="controls.effectWeapon">
              Weapon Semi-Auto (R2)
            </option>
            <option value="autogun" data-i18n="controls.effectAutoGun">
              Automatic Gun Buzz (R2)
            </option></select
          ><select id="sel-trigger-hand" class="control-select">
            <option value="1" data-i18n="controls.rightTrigger">
              Right (R2)
            </option>
            <option value="0" data-i18n="controls.leftTrigger">
              Left (L2)
            </option>
            <option value="2" data-i18n="controls.bothTriggers">
              Both (L2 + R2)
            </option>
          </select>
        </div>
        <div class="row">
          <button
            id="btn-apply-trigger"
            class="btn btn-primary"
            data-i18n="controls.applyTrigger"
          >
            Apply Effect</button
          ><button
            id="btn-reset-trigger"
            class="btn"
            data-i18n="controls.resetTriggers"
          >
            Reset
          </button>
        </div>
      </section>
      <section class="card">
        <h2>💡 <span data-i18n="controls.lightbarTitle">Lightbar</span></h2>
        <div class="color-picker">
          <input
            type="color"
            id="picker-led-color"
            value="#38bdf8"
            title="LED Color"
          /><button
            class="color-preset-btn"
            data-color="#ef4444"
            style="background: #ef4444"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#eab308"
            style="background: #eab308"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#22c55e"
            style="background: #22c55e"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#3b82f6"
            style="background: #3b82f6"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#a855f7"
            style="background: #a855f7"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#fff"
            style="background: #fff"
          ></button
          ><button
            class="color-preset-btn"
            data-color="#000"
            style="background: #000; border-color: #333"
          ></button>
        </div>
      </section>
      <section class="card">
        <h2>
          🔊
          <span data-i18n="controls.audioSettingsTitle"
            >Audio &amp; Haptics</span
          >
        </h2>
        <button
          id="btn-audio-haptics"
          class="btn btn-primary"
          style="margin-bottom: 16px"
          data-i18n="header.btnAudioHaptics"
        >
          🎵 Audio Haptics (Off)
        </button>
        <div class="audio-grid">
          <div class="audio-control">
            <label data-i18n="controls.volume">Volume</label
            ><input
              id="input-audio-volume"
              type="range"
              min="0"
              max="100"
              value="100"
            /><output id="input-audio-volume-value">100</output>
          </div>
          <div class="audio-control">
            <label
              ><span data-i18n="controls.gain">Gain</span> (<output
                id="input-audio-gain-value"
                >1.0</output
              >)</label
            ><input
              id="input-audio-gain"
              type="range"
              min="1"
              max="2"
              value="1"
              step="0.1"
            />
          </div>
          <label class="checkbox-group"
            ><input id="switch-speaker" type="checkbox" /><span
              data-i18n="controls.headsetOnly"
              >Headset only</span
            ></label
          ><label class="checkbox-group"
            ><input id="switch-audio-haptics" type="checkbox" /><span
              data-i18n="controls.modeAudioOnly"
              >Audio only</span
            ></label
          >
          <div class="audio-control-row" style="display: none">
            <label data-i18n="controls.reduceVibration">Reduce Vibration</label
            ><input
              id="input-rumble-reduce"
              type="number"
              min="0"
              max="15"
              value="0"
              style="width: 80px"
            />
          </div>
        </div>
      </section>
      <section class="card">
        <h2 data-i18n="cards.inputServer.title">🎮 Input Server</h2>
        <div class="flow-control">
          <div class="audio-control">
            <label class="input-server-help" data-i18n="controls.inputServerUrl"
              >Server URL</label
            ><input
              id="input-server-url"
              type="text"
              value="ws://localhost:26760"
            />
          </div>
          <div class="row" style="align-items: center">
            <button
              id="btn-input-server"
              class="btn btn-primary"
              data-i18n="controls.connectInputServer"
            >
              Connect</button
            ><strong
              id="input-server-status"
              data-i18n="status.disconnected"
              style="
                font-size: 0.85rem;
                color: var(--text-muted);
                text-align: right;
              "
              >Disconnected</strong
            >
          </div>
          <p class="input-server-help" data-i18n="controls.inputServerHint"></p>
          <p class="input-server-help">
            <span data-i18n="controls.inputServerRepository"
              >To connect the controller to a virtual gamepad, use this
              repository:</span
            >
            <a
              href="https://github.com/rafaelvaloto/Gamepad_Socket"
              target="_blank"
              rel="noopener noreferrer"
              >Gamepad Socket</a
            >.
          </p>
        </div>
      </section>
      <div class="technical">
        <span id="lbl-touch-status"></span><span id="lbl-is-touching"></span
        ><span id="lbl-touch-id"></span><span id="lbl-touch-dir"></span
        ><span id="lbl-touch-pos"></span><span id="lbl-touch-rel"></span
        ><span id="lbl-touch-rad"></span><span id="touch-dot-1"></span
        ><span id="touch-dot-coord"></span><span id="touch-hint"></span
        ><span id="touchpad-area"></span><span id="lbl-l1"></span
        ><span id="lbl-l2"></span><span id="bar-l2"></span
        ><span id="lbl-l2-th"></span><span id="lbl-r1"></span
        ><span id="lbl-r2"></span><span id="bar-r2"></span
        ><span id="lbl-r2-th"></span><span id="lbl-r2-active"></span
        ><span id="lbl-deadzone"></span><span id="lbl-lstick-coords"></span
        ><span id="stick-left-dot"></span><span id="lbl-l3"></span
        ><span id="lbl-la-up"></span><span id="lbl-la-down"></span
        ><span id="lbl-la-left"></span><span id="lbl-la-right"></span
        ><span id="lbl-rstick-coords"></span><span id="stick-right-dot"></span
        ><span id="lbl-r3"></span><span id="lbl-ra-up"></span
        ><span id="lbl-ra-down"></span><span id="lbl-ra-left"></span
        ><span id="lbl-ra-right"></span><span id="pill-cross"></span
        ><span id="v-cross"></span><span id="pill-circle"></span
        ><span id="v-circle"></span><span id="pill-square"></span
        ><span id="v-square"></span><span id="pill-triangle"></span
        ><span id="v-triangle"></span><span id="pill-up"></span
        ><span id="v-up"></span><span id="pill-down"></span
        ><span id="v-down"></span><span id="pill-left"></span
        ><span id="v-left"></span><span id="pill-right"></span
        ><span id="v-right"></span><span id="pill-ps"></span
        ><span id="v-ps"></span><span id="pill-share"></span
        ><span id="v-share"></span><span id="pill-options"></span
        ><span id="v-options"></span><span id="pill-touch-btn"></span
        ><span id="v-touch-btn"></span><span id="pill-mute"></span
        ><span id="v-mute"></span><span id="pill-phone"></span
        ><span id="v-phone"></span><span id="pill-fn1"></span
        ><span id="v-fn1"></span><span id="pill-fn2"></span
        ><span id="v-fn2"></span><span id="pill-padd-l"></span
        ><span id="v-padd-l"></span><span id="pill-padd-r"></span
        ><span id="v-padd-r"></span>
      </div>
      <div class="technical">
        <button id="btn-pip"></button>
        <div id="in-page-pip" style="display: none"></div>
        <div id="compact-hud"></div>
        <button id="btn-apply-led"></button><button id="btn-clear-logs"></button
        ><button id="btn-test-soft"></button
        ><button id="btn-test-heavy"></button
        ><button id="btn-test-both"></button><button id="btn-stop-vibe"></button
        ><button id="btn-stop-all"></button>
      </div>
      <a
        class="btn btn-outline"
        href="https://github.com/rafaelvaloto/DS5-Web-Audio-Haptics"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="currentColor"
        >
          <path
            d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.05c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.82.58A12 12 0 0 0 12 .5Z"
          />
        </svg>
        GitHub</a
      >
    </main>
    <dialog id="log-modal" class="log-modal">
      <div class="log-modal-head">
        <strong data-i18n="cards.logs.title"
          >📜 Diagnostic &amp; Event Log</strong
        ><button
          id="btn-close-log-modal"
          class="btn"
          style="width: auto"
          data-i18n="controls.closeLogs"
        >
          Close
        </button>
      </div>
      <div class="log-modal-body">
        <button
          id="btn-clear-modal-log"
          class="btn"
          data-i18n="controls.clearLogs"
        >
          Clear
        </button>
        <div id="log-modal-content">
          <div id="log-box" class="log-container" data-i18n="logs.wasmLoading">
            Waiting for WASM module initialization...
          </div>
        </div>
      </div>
    </dialog>
    <script src="./src/lib/GamepadCoreHost.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
