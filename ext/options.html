<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DualSense - Opções</title>
    <style>
        body { margin: 0; padding: 32px; background: #090d16; color: #f1f5f9; font: 15px system-ui, sans-serif; }
        main { max-width: 640px; margin: auto; padding: 24px; border: 1px solid #233152; border-radius: 14px; background: #131b2e; }
        button { padding: 10px 16px; border: 0; border-radius: 8px; background: #38bdf8; color: #06111c; cursor: pointer; font-weight: 600; }
        #status { min-height: 24px; color: #94a3b8; }
        #wasm-status { font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
<main>
    <h1 data-i18n="options.title">DualSense Pairing</h1>
    <p data-i18n="options.description">Authorize Chrome to read your DualSense controller. After pairing, close this page and use the side panel.</p>
    <p id="wasm-status" data-i18n="options.loading">Loading controller engine...</p>
    <button id="btn-request-options" type="button" data-i18n="options.connect">Connect DualSense</button>
    <p id="status" aria-live="polite"></p>
    <p id="authorized" data-i18n="options.none">No authorized controller found.</p>
</main>
<script type="module" src="./dist/options.js"></script>
</body>
</html>
