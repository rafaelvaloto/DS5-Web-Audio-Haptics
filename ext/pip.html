<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio &amp; Haptics</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: #0f1115;
        color: #e2e8f0;
      }
      .card {
        background: #1c2028;
        border: 1px solid #2d3340;
        border-radius: 6px;
        padding: 16px;
      }
      h2 {
        font-size: 1.1rem;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #0284c7;
        border-radius: 6px;
        background: #0284c7;
        color: #fff;
        font-weight: 500;
        cursor: pointer;
      }
      .btn.active {
        background: #16a34a;
        border-color: #16a34a;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .audio-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: center;
      }
      .audio-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .audio-control input[type="range"] {
        width: 100%;
        accent-color: #93c5fd;
      }
      .audio-control output {
        color: #94a3b8;
        font-size: 0.8rem;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-group input {
        accent-color: #0284c7;
      }
      .audio-control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .status {
        margin-top: 10px;
        color: #94a3b8;
        font-size: 0.8rem;
      }
      @media (max-width: 300px) {
        .audio-grid {
          grid-template-columns: 1fr;
        }
        .audio-control-row {
          grid-column: span 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h2>
        🔊
        <span data-i18n="controls.audioSettingsTitle">Audio &amp; Haptics</span>
      </h2>
      <button
        id="pip-audio"
        class="btn"
        type="button"
        data-i18n="header.btnAudioHaptics"
      >
        🎵 Audio Haptics (Off)
      </button>
      <div class="audio-grid" style="margin-top: 16px">
        <div class="audio-control">
          <label data-i18n="controls.volume">Volume</label
          ><input
            id="pip-volume"
            type="range"
            min="0"
            max="100"
            value="100"
            step="1"
          /><output id="pip-volume-value">100</output>
        </div>
        <div class="audio-control">
          <label
            ><span data-i18n="controls.gain">Gain</span> (<output
              id="pip-gain-value"
              >1.0</output
            >)</label
          ><input
            id="pip-gain"
            type="range"
            min="1"
            max="2"
            value="1"
            step="0.1"
          />
        </div>
        <label class="checkbox-group"
          ><input id="pip-headset-only" type="checkbox" /><span
            data-i18n="controls.headsetOnly"
            >Headset only</span
          ></label
        >
        <label class="checkbox-group"
          ><input id="pip-audio-only" type="checkbox" /><span
            data-i18n="controls.modeAudioOnly"
            >Audio only</span
          ></label
        >
        <div class="audio-control-row" style="grid-column: span 2">
          <label data-i18n="controls.reduceVibration">Reduce Vibration</label
          ><input
            id="pip-rumble-reduce"
            type="number"
            min="0"
            max="15"
            value="0"
            style="width: 80px"
          />
        </div>
      </div>
      <div id="status" class="status"></div>
    </section>
    <script type="module" src="pip.js"></script>
  </body>
</html>
